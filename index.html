<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoveBuss Relatórios</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
  <div id="loginContainer">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" id="loginMatricula" placeholder="Matrícula" required />
      <input type="password" id="loginPassword" placeholder="Senha" required />
      <button type="submit">Entrar</button>
    </form>
    <button id="showRegister">Cadastrar Novo Usuário</button>
  </div>

  <div id="registerContainer" class="hidden">
    <h2>Cadastrar Usuário</h2>
    <form id="registerForm">
      <input type="text" id="registerMatricula" placeholder="Matrícula" required />
      <input type="text" id="registerNome" placeholder="Nome" required />
      <input type="password" id="registerPassword" placeholder="Senha" required />
      <button type="submit">Cadastrar</button>
    </form>
    <button id="backToLogin">Voltar</button>
  </div>

  <div id="mainContainer" class="hidden">
    <div id="adminControls" class="hidden">
      <button id="toggleCreateForm">Novo Relatório</button>
      <input id="adminFilterMat" type="text" placeholder="Pesquisar matrícula" />
      <button id="btnResumo">Resumo</button>
    </div>
    <button id="logoutBtn">Logout</button>
    <h2>Relatórios</h2>
    <div id="reportList"></div>
    <div id="createReportForm" class="hidden">
      <h3>Novo Relatório</h3>
      <form id="reportForm">
        <input type="text" id="relMatricula" placeholder="Matrícula" required />
        <input type="text" id="relDescricao" placeholder="Descrição" required />
        <button type="submit">Salvar</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
